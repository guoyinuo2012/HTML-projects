<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>TerraPulse — Real-Time World Map & Navigation</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="anonymous"
  />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Font: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Light Theme (Frosted Glass) */
      --bg-glass: rgba(255, 255, 255, 0.82);
      --bg-glass-hover: rgba(255, 255, 255, 0.95);
      --bg-subtle: rgba(241, 245, 249, 0.7);
      --border-glass: rgba(255, 255, 255, 0.9);
      --border-subtle: rgba(226, 232, 240, 0.8);
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;

      /* Vibrant Accents */
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.25);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.25);
      --red: #ef4444;
      --amber: #f59e0b;
      --purple: #8b5cf6;

      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 30px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 20px 40px -8px rgba(15, 23, 42, 0.16), 0 6px 16px -4px rgba(15, 23, 42, 0.06);
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-full: 9999px;
    }

    [data-theme="dark"] {
      --bg-glass: rgba(15, 23, 42, 0.78);
      --bg-glass-hover: rgba(30, 41, 59, 0.9);
      --bg-subtle: rgba(30, 41, 59, 0.6);
      --border-glass: rgba(255, 255, 255, 0.09);
      --border-subtle: rgba(51, 65, 85, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --shadow-md: 0 14px 35px -4px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 50px -8px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); background: #0b0f19; color: var(--text); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; outline: none; border: none; background: transparent; color: inherit; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Dark Mode Basemap Filter */
    .map-tiles-dark .leaflet-tile {
      filter: brightness(0.68) invert(1) contrast(2.3) hue-rotate(205deg) saturate(0.35);
    }

    /* Clean Glass Panels */
    .glass-surface {
      background: var(--bg-glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Left Control Stack */
    .app-sidebar {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 410px;
      max-width: calc(100vw - 36px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .app-sidebar > * { pointer-events: auto; }

    /* Search Bar */
    .search-card {
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg);
    }
    .search-card:focus-within {
      border-color: var(--accent);
      box-shadow: var(--shadow-lg), 0 0 0 3px var(--accent-glow);
    }
    .search-icon-wrap {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    .search-input {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .search-input::placeholder { color: var(--text-dim); font-weight: 400; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.18s ease;
    }
    .icon-btn:hover { background: var(--bg-subtle); color: var(--text); transform: scale(1.04); }
    .icon-btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
    .icon-btn.primary:hover { background: var(--accent-hover); color: #fff; }

    /* Quick Category Pills */
    .poi-carousel {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 6px 2px;
      scrollbar-width: none;
    }
    .poi-carousel::-webkit-scrollbar { display: none; }
    .category-pill {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      padding: 7px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .category-pill:hover {
      background: var(--bg-glass-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      color: var(--accent);
    }
    .pill-icon { width: 14px; height: 14px; stroke-width: 2.2; }

    /* Suggestions Flyout */
    .suggestions-panel {
      border-radius: var(--radius-xl);
      overflow: hidden;
      max-height: 290px;
      overflow-y: auto;
    }
    .suggestion-row {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s;
    }
    .suggestion-row:last-child { border-bottom: none; }
    .suggestion-row:hover { background: var(--bg-subtle); }
    .sugg-meta h4 { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .sugg-meta p { font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; margin-top: 2px; }

    /* Directions Card */
    .directions-card {
      display: none;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      border-radius: var(--radius-xl);
    }
    .directions-card.active { display: flex; animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

    /* Mode Pill Selector */
    .mode-switcher {
      display: flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: var(--radius-lg);
      gap: 4px;
    }
    .mode-tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 0;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .mode-tab-btn.active {
      background: var(--bg-glass-hover);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .route-inputs-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .route-indicators {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.start { background: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
    .dot.end { background: var(--red); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }
    .line-track { width: 2px; height: 26px; background: var(--border-subtle); border-radius: 1px; }

    .route-fields-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .input-pill {
      display: flex;
      align-items: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 8px 12px;
      transition: all 0.2s;
    }
    .input-pill:focus-within { border-color: var(--accent); background: var(--bg-glass-hover); }
    .input-pill input { flex: 1; font-size: 0.85rem; font-weight: 500; }

    /* Route Summary / Maneuvers Card */
    .route-details-card {
      display: none;
      flex-direction: column;
      max-height: calc(100vh - 300px);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    .route-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .route-stats { display: flex; align-items: baseline; gap: 8px; }
    .duration-text { font-size: 1.45rem; font-weight: 800; color: var(--green); letter-spacing: -0.5px; }
    .distance-text { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); }

    .route-toolbar {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }
    .action-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .action-btn:hover { background: var(--bg-glass-hover); transform: translateY(-1px); color: var(--accent); }
    .action-btn.primary-action { background: var(--accent); color: #fff; box-shadow: 0 4px 12px var(--accent-glow); }
    .action-btn.primary-action:hover { background: var(--accent-hover); color: #fff; }

    .maneuver-list { overflow-y: auto; list-style: none; padding: 4px 0; }
    .maneuver-item {
      padding: 12px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.15s;
    }
    .maneuver-item:hover { background: var(--bg-subtle); }
    .maneuver-item:last-child { border-bottom: none; }
    .maneuver-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-subtle);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .maneuver-desc { font-size: 0.85rem; font-weight: 500; line-height: 1.35; }
    .maneuver-dist { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-top: 3px; font-family: var(--font-mono); }

    /* ==========================================================================
       Turn-By-Turn "In-Drive" HUD Experience
       ========================================================================== */
    .drive-top-banner {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      z-index: 2000;
      background: #0f172a;
      color: #ffffff;
      padding: 14px 22px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 320px;
      max-width: calc(100vw - 36px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drive-top-banner.active { transform: translateX(-50%) translateY(0); }
    .turn-glyph {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-lg);
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .drive-banner-meta h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; }
    .drive-banner-meta p { font-size: 0.8rem; color: #94a3b8; font-weight: 500; font-family: var(--font-mono); margin-top: 2px; }

    /* Bottom Drive Island */
    .drive-bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      background: var(--bg-glass);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-lg);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drive-bottom-bar.active { transform: translateX(-50%) translateY(0); }
    .drive-stat-group { display: flex; align-items: baseline; gap: 4px; padding: 0 6px; }
    .drive-stat-num { font-size: 1.35rem; font-weight: 800; font-family: var(--font-mono); color: var(--accent); }
    .drive-stat-unit { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .end-nav-pill {
      background: var(--red);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      transition: transform 0.15s;
    }
    .end-nav-pill:hover { transform: scale(1.05); }

    /* Right Dock Controls */
    .right-dock {
      position: absolute;
      bottom: 24px;
      right: 18px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dock-pill {
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-md);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dock-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dock-btn:hover { background: var(--bg-subtle); color: var(--accent); transform: scale(1.08); }
    .dock-btn.active { background: var(--accent); color: #ffffff; box-shadow: 0 4px 12px var(--accent-glow); }

    /* Popover Panels (Layers, Bookmarks) */
    .dock-popover {
      position: absolute;
      bottom: 6px;
      right: 56px;
      background: var(--bg-glass);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 14px;
      width: 220px;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .popover-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .radio-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.15s;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .radio-card:hover { background: var(--bg-subtle); }
    .radio-card input { accent-color: var(--accent); }

    /* Ruler Measurement Floating Badge */
    .ruler-pill-hud {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 600;
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
    }
    .ruler-pill-hud strong { color: var(--amber); font-family: var(--font-mono); }
    .ruler-pill-hud button {
      background: rgba(255,255,255,0.18);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
    }

    /* Popups Custom Theme */
    .leaflet-popup-content-wrapper {
      background: var(--bg-glass) !important;
      backdrop-filter: blur(24px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
      border: 1px solid var(--border-glass) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow-lg) !important;
      color: var(--text) !important;
      padding: 4px;
    }
    .leaflet-popup-tip { background: var(--bg-glass) !important; }

    .custom-popup-body {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
    }
    .popup-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .weather-pill {
      background: var(--bg-subtle);
      padding: 4px 8px;
      border-radius: var(--radius-full);
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .popup-actions-menu { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .popup-menu-btn {
      padding: 7px 10px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .popup-menu-btn:hover { background: var(--bg-subtle); color: var(--accent); }

    /* Toast Notification */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f172a;
      color: #fff;
      padding: 10px 22px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 4000;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toast-pill.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Animations */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body data-theme="light">
  <!-- Map Canvas -->
  <div id="map"></div>

  <!-- Ruler HUD -->
  <div id="rulerBanner" class="ruler-pill-hud">
    <span>📐 Distance: <strong id="rulerDist">0.00 km</strong></span>
    <button id="rulerDoneBtn">Done</button>
  </div>

  <!-- In-Drive Turn-by-Turn Banner (Top) -->
  <div class="drive-top-banner" id="driveBanner">
    <div class="turn-glyph">
      <i data-lucide="arrow-up-right" id="driveTurnIcon" style="width:24px; height:24px; color:#fff;"></i>
    </div>
    <div class="drive-banner-meta">
      <h3 id="driveInstructionText">In 200m, turn right onto Main St</h3>
      <p id="driveNextStepDist">200 meters remaining</p>
    </div>
  </div>

  <!-- In-Drive Live HUD (Bottom Island) -->
  <div class="drive-bottom-bar" id="driveBottomBar">
    <div class="drive-stat-group">
      <span class="drive-stat-num" id="driveSpeed">48</span>
      <span class="drive-stat-unit">km/h</span>
    </div>
    <div style="width:1px; height:24px; background:var(--border-subtle);"></div>
    <div class="drive-stat-group">
      <span class="drive-stat-num" id="driveEtaMin">12</span>
      <span class="drive-stat-unit">min</span>
    </div>
    <button class="end-nav-pill" id="endDriveBtn">
      <i data-lucide="x" style="width:14px; height:14px;"></i> End
    </button>
  </div>

  <!-- Primary Floating Sidebar / Navigation Deck -->
  <div class="app-sidebar" id="appSidebar">
    <!-- Search Bar Card -->
    <div class="glass-surface search-card" id="searchCard">
      <div class="search-icon-wrap">
        <i data-lucide="search" style="width:18px; height:18px;"></i>
      </div>
      <input
        type="text"
        id="globalSearchInput"
        class="search-input"
        placeholder="Search places, addresses..."
        autocomplete="off"
      />
      <div style="display:flex; align-items:center; gap:4px;">
        <button id="clearSearchBtn" class="icon-btn" style="display:none;" title="Clear">
          <i data-lucide="x" style="width:16px; height:16px;"></i>
        </button>
        <button id="openDirectionsBtn" class="icon-btn primary" title="Get Directions">
          <i data-lucide="corner-up-right" style="width:18px; height:18px;"></i>
        </button>
      </div>
    </div>

    <!-- Live Autocomplete Suggestions -->
    <div class="glass-surface suggestions-panel" id="searchSuggestions" style="display: none;"></div>

    <!-- POI Quick Filter Pills -->
    <div class="poi-carousel" id="poiCarousel">
      <button class="category-pill" data-category="restaurant">
        <i data-lucide="utensils" class="pill-icon" style="color:#f97316;"></i> Food
      </button>
      <button class="category-pill" data-category="cafe">
        <i data-lucide="coffee" class="pill-icon" style="color:#8b5cf6;"></i> Cafes
      </button>
      <button class="category-pill" data-category="fuel">
        <i data-lucide="fuel" class="pill-icon" style="color:#ef4444;"></i> Gas & EV
      </button>
      <button class="category-pill" data-category="pharmacy">
        <i data-lucide="cross" class="pill-icon" style="color:#10b981;"></i> Pharmacy
      </button>
      <button class="category-pill" data-category="hotel">
        <i data-lucide="bed" class="pill-icon" style="color:#3b82f6;"></i> Hotels
      </button>
    </div>

    <!-- Directions Input Box -->
    <div class="glass-surface directions-card" id="directionsPanel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="mode-switcher">
          <button class="mode-tab-btn active" data-mode="driving">
            <i data-lucide="car" style="width:15px; height:15px;"></i> Drive
          </button>
          <button class="mode-tab-btn" data-mode="walking">
            <i data-lucide="footprints" style="width:15px; height:15px;"></i> Walk
          </button>
          <button class="mode-tab-btn" data-mode="cycling">
            <i data-lucide="bike" style="width:15px; height:15px;"></i> Bike
          </button>
        </div>
        <button id="closeDirectionsBtn" class="icon-btn" title="Close"><i data-lucide="x" style="width:18px;"></i></button>
      </div>

      <div class="route-inputs-box">
        <div class="route-indicators">
          <span class="dot start"></span>
          <span class="line-track"></span>
          <span class="dot end"></span>
        </div>
        <div class="route-fields-col">
          <div class="input-pill">
            <input type="text" id="startInput" placeholder="Choose starting point..." />
            <button id="useCurrentLocationStartBtn" class="icon-btn" style="width:28px; height:28px;" title="Current GPS">
              <i data-lucide="crosshair" style="width:14px;"></i>
            </button>
          </div>
          <div class="input-pill">
            <input type="text" id="endInput" placeholder="Choose destination..." />
          </div>
        </div>
        <button id="swapLocationsBtn" class="icon-btn" title="Swap"><i data-lucide="arrow-up-down" style="width:16px;"></i></button>
      </div>
    </div>

    <!-- Route Summary & Turn Drawer -->
    <div class="glass-surface route-details-card" id="routeSummaryCard">
      <div class="route-header">
        <div class="route-stats">
          <span class="duration-text" id="routeDuration">— min</span>
          <span class="distance-text" id="routeDistance">— km</span>
        </div>
        <button id="clearRouteBtn" class="icon-btn" title="Clear"><i data-lucide="trash-2" style="width:16px;"></i></button>
      </div>
      <div class="route-toolbar">
        <button class="action-btn primary-action" id="startSimBtn">
          <i data-lucide="navigation-2" style="width:14px;"></i> Start
        </button>
        <button class="action-btn" id="voiceToggleBtn">
          <i data-lucide="volume-2" style="width:14px;"></i> Voice: On
        </button>
        <button class="action-btn" id="exportGpxBtn">
          <i data-lucide="download" style="width:14px;"></i> GPX
        </button>
      </div>
      <ul class="maneuver-list" id="routeStepsList"></ul>
    </div>
  </div>

  <!-- Right Floating Action Dock -->
  <div class="right-dock">
    <div class="dock-pill">
      <button id="gpsFollowBtn" class="dock-btn" title="Track My Location">
        <i data-lucide="crosshair" style="width:18px;"></i>
      </button>
      <button id="measureToolBtn" class="dock-btn" title="Measure Ruler">
        <i data-lucide="ruler" style="width:18px;"></i>
      </button>
      <div style="position: relative;">
        <button id="bookmarksBtn" class="dock-btn" title="Saved Bookmarks">
          <i data-lucide="bookmark" style="width:18px;"></i>
        </button>
        <div id="bookmarksDropdown" class="dock-popover">
          <div class="popover-title">Saved Places</div>
          <ul id="bookmarksList" style="max-height:180px; overflow-y:auto; list-style:none;"></ul>
        </div>
      </div>
      <div style="position: relative;">
        <button id="layerMenuToggleBtn" class="dock-btn" title="Map Layers">
          <i data-lucide="layers" style="width:18px;"></i>
        </button>
        <div id="layerDropdown" class="dock-popover">
          <div class="popover-title">Basemap</div>
          <label class="radio-card"><input type="radio" name="basemap" value="streets" checked /> Streets</label>
          <label class="radio-card"><input type="radio" name="basemap" value="satellite" /> Satellite</label>
          <label class="radio-card"><input type="radio" name="basemap" value="topo" /> Topographic</label>
          <label class="radio-card"><input type="radio" name="basemap" value="dark" /> Dark Theme</label>
        </div>
      </div>
      <button id="themeToggleBtn" class="dock-btn" title="Theme">
        <i data-lucide="moon" id="themeIcon" style="width:18px;"></i>
      </button>
    </div>
  </div>

  <div id="toast" class="toast-pill"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="anonymous"
  ></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
      }

      /* 1. Map Initialization */
      const map = L.map('map', {
        center: [40.7128, -74.0060],
        zoom: 13,
        maxZoom: 19,
        zoomControl: false
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

      // Free, high-speed, reliable Esri tile layers
      const tileLayers = {
        streets: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19, attribution: '&copy; Esri &mdash; StreetMap'
        }),
        satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19, attribution: '&copy; Esri, Earthstar Geographics'
        }),
        topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19, attribution: '&copy; Esri, USGS'
        }),
        dark: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19, className: 'map-tiles-dark', attribution: '&copy; Esri'
        })
      };

      let activeBasemap = tileLayers.streets.addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        }, () => {});
      }

      /* 2. Global Autocomplete Search */
      const searchInput = document.getElementById('globalSearchInput');
      const searchSuggestions = document.getElementById('searchSuggestions');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      let searchMarker = null;
      let debounceTimer = null;

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        clearSearchBtn.style.display = query ? 'flex' : 'none';
        clearTimeout(debounceTimer);
        if (!query || query.length < 2) {
          searchSuggestions.style.display = 'none';
          return;
        }

        debounceTimer = setTimeout(async () => {
          try {
            const center = map.getCenter();
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=${center.lat}&lon=${center.lng}&limit=5`);
            const data = await res.json();

            if (!data.features || data.features.length === 0) {
              searchSuggestions.innerHTML = `<div class="suggestion-row"><p style="color:var(--text-muted); font-size:0.8rem;">No results found</p></div>`;
              searchSuggestions.style.display = 'block';
              return;
            }

            searchSuggestions.innerHTML = data.features.map(f => {
              const p = f.properties;
              const title = p.name || p.street || 'Location';
              const subtitle = [p.street, p.city, p.state, p.country].filter(Boolean).join(', ');
              return `
                <div class="suggestion-row" data-lat="${f.geometry.coordinates[1]}" data-lng="${f.geometry.coordinates[0]}" data-name="${title}">
                  <i data-lucide="map-pin" style="width:16px; color:var(--accent); flex-shrink:0;"></i>
                  <div class="sugg-meta">
                    <h4>${title}</h4>
                    <p>${subtitle || 'Earth'}</p>
                  </div>
                </div>
              `;
            }).join('');

            lucide.createIcons();
            searchSuggestions.style.display = 'block';

            searchSuggestions.querySelectorAll('.suggestion-row').forEach(row => {
              row.addEventListener('click', () => {
                const lat = parseFloat(row.dataset.lat);
                const lng = parseFloat(row.dataset.lng);
                const name = row.dataset.name;

                if (searchMarker) map.removeLayer(searchMarker);
                searchMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<strong>${name}</strong>`).openPopup();
                map.flyTo([lat, lng], 16, { duration: 1.2 });
                searchInput.value = name;
                searchSuggestions.style.display = 'none';
              });
            });
          } catch (err) {
            console.error(err);
          }
        }, 280);
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchSuggestions.style.display = 'none';
        clearSearchBtn.style.display = 'none';
        if (searchMarker) map.removeLayer(searchMarker);
      });

      /* 3. Category Filter Chips */
      const poiMarkers = L.layerGroup().addTo(map);
      document.querySelectorAll('.category-pill').forEach(chip => {
        chip.addEventListener('click', async () => {
          const cat = chip.dataset.category;
          const center = map.getCenter();
          showToast(`Searching nearby ${cat}s...`);

          try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(cat)}&lat=${center.lat}&lon=${center.lng}&limit=15`);
            const data = await res.json();
            poiMarkers.clearLayers();

            if (!data.features || data.features.length === 0) {
              showToast(`No ${cat}s found in this area.`);
              return;
            }

            data.features.forEach(f => {
              const [lng, lat] = f.geometry.coordinates;
              const name = f.properties.name || f.properties.street || cat;
              const marker = L.circleMarker([lat, lng], {
                radius: 7, fillColor: '#2563eb', color: '#fff', weight: 2.5, fillOpacity: 0.95
              }).bindPopup(`<strong>${name}</strong><br><small style="color:var(--text-muted); text-transform:uppercase;">${cat}</small>`);
              poiMarkers.addLayer(marker);
            });
            showToast(`Found ${data.features.length} locations`);
          } catch {
            showToast('POI search failed');
          }
        });
      });

      /* 4. GPS Directions Engine */
      let startCoords = null, endCoords = null, currentMode = 'driving';
      let routePolyline = null, startMarker = null, endMarker = null;
      let activeRouteData = null;

      const directionsPanel = document.getElementById('directionsPanel');
      const routeSummaryCard = document.getElementById('routeSummaryCard');
      const startInput = document.getElementById('startInput');
      const endInput = document.getElementById('endInput');
      const routeDuration = document.getElementById('routeDuration');
      const routeDistance = document.getElementById('routeDistance');
      const routeStepsList = document.getElementById('routeStepsList');

      document.getElementById('openDirectionsBtn').addEventListener('click', () => {
        directionsPanel.classList.add('active');
        if (searchMarker) {
          endCoords = searchMarker.getLatLng();
          endInput.value = searchInput.value;
          setMarker('end', endCoords);
        }
      });

      document.getElementById('closeDirectionsBtn').addEventListener('click', () => {
        directionsPanel.classList.remove('active');
        routeSummaryCard.style.display = 'none';
        clearRoute();
      });

      document.querySelectorAll('.mode-tab-btn').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.mode-tab-btn').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentMode = tab.dataset.mode;
          if (startCoords && endCoords) calculateRoute();
        });
      });

      document.getElementById('swapLocationsBtn').addEventListener('click', () => {
        const tempCoords = startCoords; startCoords = endCoords; endCoords = tempCoords;
        const tempText = startInput.value; startInput.value = endInput.value; endInput.value = tempText;
        setMarker('start', startCoords);
        setMarker('end', endCoords);
        if (startCoords && endCoords) calculateRoute();
      });

      document.getElementById('useCurrentLocationStartBtn').addEventListener('click', () => {
        if (!navigator.geolocation) return showToast('Geolocation not supported');
        showToast('Locating...');
        navigator.geolocation.getCurrentPosition(pos => {
          startCoords = L.latLng(pos.coords.latitude, pos.coords.longitude);
          startInput.value = 'Your Location';
          setMarker('start', startCoords);
          map.setView(startCoords, 15);
          if (endCoords) calculateRoute();
        }, () => showToast('Could not retrieve GPS location'));
      });

      function setMarker(type, latlng) {
        if (!latlng) return;
        const color = type === 'start' ? 'var(--green)' : 'var(--red)';
        const iconHtml = `<div style="background:${color}; width:16px; height:16px; border:3px solid #fff; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.35);"></div>`;
        const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [16, 16], iconAnchor: [8, 8] });

        if (type === 'start') {
          if (startMarker) map.removeLayer(startMarker);
          startMarker = L.marker(latlng, { icon: customIcon, draggable: true }).addTo(map);
          startMarker.on('dragend', (e) => {
            startCoords = e.target.getLatLng();
            startInput.value = `${startCoords.lat.toFixed(4)}, ${startCoords.lng.toFixed(4)}`;
            if (endCoords) calculateRoute();
          });
        } else {
          if (endMarker) map.removeLayer(endMarker);
          endMarker = L.marker(latlng, { icon: customIcon, draggable: true }).addTo(map);
          endMarker.on('dragend', (e) => {
            endCoords = e.target.getLatLng();
            endInput.value = `${endCoords.lat.toFixed(4)}, ${endCoords.lng.toFixed(4)}`;
            if (startCoords) calculateRoute();
          });
        }
      }

      async function calculateRoute() {
        if (!startCoords || !endCoords) return;
        showToast('Finding best route...');
        const url = `https://router.project-osrm.org/route/v1/${currentMode}/${startCoords.lng},${startCoords.lat};${endCoords.lng},${endCoords.lat}?overview=full&geometries=geojson&steps=true`;

        try {
          const res = await fetch(url);
          const data = await res.json();
          if (!data.routes || data.routes.length === 0) {
            showToast('No route found');
            return;
          }
          activeRouteData = data.routes[0];
          renderRoute(activeRouteData);
        } catch {
          showToast('Routing service busy. Try again.');
        }
      }

      function renderRoute(route) {
        if (routePolyline) map.removeLayer(routePolyline);

        const latLngs = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
        routePolyline = L.polyline(latLngs, {
          color: '#2563eb', weight: 6, opacity: 0.9, lineJoin: 'round'
        }).addTo(map);

        map.fitBounds(routePolyline.getBounds(), { padding: [70, 70] });

        const durationMin = Math.round(route.duration / 60);
        const distanceKm = (route.distance / 1000).toFixed(1);
        routeDuration.textContent = durationMin >= 60 ? `${Math.floor(durationMin / 60)}h ${durationMin % 60}m` : `${durationMin} min`;
        routeDistance.textContent = `${distanceKm} km`;

        const steps = route.legs[0].steps;
        routeStepsList.innerHTML = steps.map((step, idx) => {
          const distM = Math.round(step.distance);
          const distStr = distM >= 1000 ? `${(distM / 1000).toFixed(1)} km` : `${distM} m`;
          const instruction = step.maneuver.instruction || formatManeuver(step.maneuver, step.name);
          return `
            <li class="maneuver-item" data-step-idx="${idx}" data-lat="${step.maneuver.location[1]}" data-lng="${step.maneuver.location[0]}">
              <div class="maneuver-icon"><i data-lucide="navigation" style="width:14px; height:14px;"></i></div>
              <div style="flex:1;">
                <div class="maneuver-desc">${instruction}</div>
                <div class="maneuver-dist">${distStr}</div>
              </div>
            </li>
          `;
        }).join('');

        lucide.createIcons();
        routeSummaryCard.style.display = 'flex';

        routeStepsList.querySelectorAll('.maneuver-item').forEach(item => {
          item.addEventListener('click', () => {
            const lat = parseFloat(item.dataset.lat);
            const lng = parseFloat(item.dataset.lng);
            map.flyTo([lat, lng], 17, { duration: 0.8 });
          });
        });
      }

      function formatManeuver(m, street) {
        const mod = m.modifier ? ` ${m.modifier}` : '';
        const onStreet = street ? ` onto <strong>${street}</strong>` : '';
        if (m.type === 'depart') return `Head${mod}${onStreet}`;
        if (m.type === 'arrive') return `Arrive at destination`;
        return `${m.type ? m.type.charAt(0).toUpperCase() + m.type.slice(1) : 'Proceed'}${mod}${onStreet}`;
      }

      function clearRoute() {
        endInDriveHUD();
        if (routePolyline) map.removeLayer(routePolyline);
        if (startMarker) map.removeLayer(startMarker);
        if (endMarker) map.removeLayer(endMarker);
        routePolyline = null; startMarker = null; endMarker = null; activeRouteData = null;
        startCoords = null; endCoords = null;
        startInput.value = ''; endInput.value = '';
        routeSummaryCard.style.display = 'none';
      }
      document.getElementById('clearRouteBtn').addEventListener('click', clearRoute);

      /* 5. Voice Guidance */
      let voiceEnabled = true;
      const voiceToggleBtn = document.getElementById('voiceToggleBtn');
      voiceToggleBtn.addEventListener('click', () => {
        voiceEnabled = !voiceEnabled;
        voiceToggleBtn.innerHTML = voiceEnabled ? `<i data-lucide="volume-2" style="width:14px;"></i> Voice: On` : `<i data-lucide="volume-x" style="width:14px;"></i> Voice: Off`;
        lucide.createIcons();
      });

      function speak(text) {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const clean = text.replace(/<[^>]*>/g, '');
        const utter = new SpeechSynthesisUtterance(clean);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
      }

      /* 6. Active In-Drive Simulation Experience */
      let simInterval = null;
      let simMarker = null;
      const startSimBtn = document.getElementById('startSimBtn');
      const driveBanner = document.getElementById('driveBanner');
      const driveBottomBar = document.getElementById('driveBottomBar');
      const appSidebar = document.getElementById('appSidebar');

      startSimBtn.addEventListener('click', startInDriveHUD);
      document.getElementById('endDriveBtn').addEventListener('click', endInDriveHUD);

      function startInDriveHUD() {
        if (!activeRouteData) return;
        const coords = activeRouteData.geometry.coordinates;
        if (!coords || coords.length < 2) return;

        // Transition UI to Drive Mode
        appSidebar.style.opacity = '0';
        appSidebar.style.pointerEvents = 'none';
        driveBanner.classList.add('active');
        driveBottomBar.classList.add('active');

        speak("Starting navigation. Proceed to highlighted route.");

        const carIcon = L.divIcon({
          html: `<div style="background:#2563eb; width:22px; height:22px; border:3px solid #fff; border-radius:50%; box-shadow:0 0 12px rgba(37,99,235,0.8); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px;">▲</div>`,
          iconSize: [22, 22], iconAnchor: [11, 11]
        });

        if (simMarker) map.removeLayer(simMarker);
        simMarker = L.marker([coords[0][1], coords[0][0]], { icon: carIcon }).addTo(map);

        let idx = 0;
        const steps = activeRouteData.legs[0].steps;
        let stepIdx = 0;

        simInterval = setInterval(() => {
          if (idx >= coords.length - 1) {
            endInDriveHUD();
            speak("You have arrived at your destination.");
            return;
          }

          idx++;
          const cur = coords[idx];
          const latlng = [cur[1], cur[0]];
          simMarker.setLatLng(latlng);
          map.panTo(latlng, { animate: true, duration: 0.35 });

          // Update Drive Banner Maneuver Step
          if (steps[stepIdx]) {
            const nextStep = steps[stepIdx];
            const instruction = nextStep.maneuver.instruction || formatManeuver(nextStep.maneuver, nextStep.name);
            document.getElementById('driveInstructionText').innerHTML = instruction;
            document.getElementById('driveNextStepDist').textContent = `${Math.round(nextStep.distance)}m remaining`;
            if (idx % 8 === 0 && stepIdx < steps.length - 1) stepIdx++;
          }

          document.getElementById('driveSpeed').textContent = currentMode === 'walking' ? '5' : (currentMode === 'cycling' ? '18' : '48');
        }, 500);
      }

      function endInDriveHUD() {
        if (simInterval) clearInterval(simInterval);
        simInterval = null;
        if (simMarker) map.removeLayer(simMarker);
        simMarker = null;

        driveBanner.classList.remove('active');
        driveBottomBar.classList.remove('active');
        appSidebar.style.opacity = '1';
        appSidebar.style.pointerEvents = 'auto';
      }

      /* 7. GPX Route Export */
      document.getElementById('exportGpxBtn').addEventListener('click', () => {
        if (!activeRouteData) return showToast('No active route to export');
        const coords = activeRouteData.geometry.coordinates;
        let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="TerraPulse">\n<trk><name>Route</name><trkseg>\n`;
        coords.forEach(pt => { gpx += `  <trkpt lat="${pt[1]}" lon="${pt[0]}"></trkpt>\n`; });
        gpx += `</trkseg></trk>\n</gpx>`;

        const blob = new Blob([gpx], { type: 'application/gpx+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `route-${Date.now()}.gpx`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('GPX exported');
      });

      /* 8. Measure Ruler Tool */
      let isMeasuring = false;
      let measurePoints = [];
      let measureLine = null;
      const measureToolBtn = document.getElementById('measureToolBtn');
      const rulerBanner = document.getElementById('rulerBanner');
      const rulerDist = document.getElementById('rulerDist');

      measureToolBtn.addEventListener('click', () => {
        isMeasuring = !isMeasuring;
        measureToolBtn.classList.toggle('active', isMeasuring);
        rulerBanner.style.display = isMeasuring ? 'flex' : 'none';
        if (!isMeasuring) resetMeasurement();
        else showToast('Click points on the map to measure');
      });

      document.getElementById('rulerDoneBtn').addEventListener('click', () => {
        isMeasuring = false;
        measureToolBtn.classList.remove('active');
        rulerBanner.style.display = 'none';
        resetMeasurement();
      });

      function resetMeasurement() {
        if (measureLine) map.removeLayer(measureLine);
        measurePoints = [];
        measureLine = null;
        rulerDist.textContent = '0.00 km';
      }

      map.on('click', (e) => {
        if (!isMeasuring) return;
        measurePoints.push(e.latlng);
        if (!measureLine) {
          measureLine = L.polyline(measurePoints, { color: '#f59e0b', weight: 4, dashArray: '5, 8' }).addTo(map);
        } else {
          measureLine.setLatLngs(measurePoints);
        }

        let total = 0;
        for (let i = 1; i < measurePoints.length; i++) {
          total += measurePoints[i - 1].distanceTo(measurePoints[i]);
        }
        rulerDist.textContent = `${(total / 1000).toFixed(2)} km`;
      });

      /* 9. Context Click: Weather, Altitude & Elevation */
      map.on('contextmenu', async (e) => {
        const { lat, lng } = e.latlng;
        const popupContent = document.createElement('div');
        popupContent.className = 'custom-popup-body';
        popupContent.innerHTML = `
          <div class="popup-badge-row">
            <strong>${lat.toFixed(4)}, ${lng.toFixed(4)}</strong>
            <span class="weather-pill" id="popWeatherBadge">Loading...</span>
          </div>
          <div class="popup-actions-menu">
            <button class="popup-menu-btn" id="popStart"><i data-lucide="play" style="width:14px; color:var(--green);"></i> Directions from here</button>
            <button class="popup-menu-btn" id="popEnd"><i data-lucide="flag" style="width:14px; color:var(--red);"></i> Directions to here</button>
            <button class="popup-menu-btn" id="popSave"><i data-lucide="bookmark" style="width:14px; color:var(--amber);"></i> Save bookmark</button>
          </div>
        `;

        L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
        lucide.createIcons();

        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&elevation=nan`);
          const data = await res.json();
          if (data.current_weather) {
            document.getElementById('popWeatherBadge').textContent = `${data.current_weather.temperature}°C • ${data.elevation ?? 0}m`;
          }
        } catch {
          document.getElementById('popWeatherBadge').textContent = `Point Info`;
        }

        popupContent.querySelector('#popStart').addEventListener('click', () => {
          startCoords = e.latlng;
          startInput.value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          setMarker('start', startCoords);
          directionsPanel.classList.add('active');
          map.closePopup();
          if (endCoords) calculateRoute();
        });

        popupContent.querySelector('#popEnd').addEventListener('click', () => {
          endCoords = e.latlng;
          endInput.value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          setMarker('end', endCoords);
          directionsPanel.classList.add('active');
          map.closePopup();
          if (startCoords) calculateRoute();
        });

        popupContent.querySelector('#popSave').addEventListener('click', () => {
          const name = prompt('Name this place:', `Saved (${lat.toFixed(3)}, ${lng.toFixed(3)})`);
          if (name) saveBookmark(name, lat, lng);
          map.closePopup();
        });
      });

      /* 10. Bookmarks Storage */
      const bookmarksBtn = document.getElementById('bookmarksBtn');
      const bookmarksDropdown = document.getElementById('bookmarksDropdown');
      const bookmarksList = document.getElementById('bookmarksList');

      bookmarksBtn.addEventListener('click', () => {
        bookmarksDropdown.style.display = bookmarksDropdown.style.display === 'flex' ? 'none' : 'flex';
        loadBookmarks();
      });

      function getBookmarks() {
        return JSON.parse(localStorage.getItem('terra_bookmarks') || '[]');
      }

      function saveBookmark(name, lat, lng) {
        const bookmarks = getBookmarks();
        bookmarks.push({ name, lat, lng });
        localStorage.setItem('terra_bookmarks', JSON.stringify(bookmarks));
        showToast(`Saved "${name}"`);
      }

      function loadBookmarks() {
        const bookmarks = getBookmarks();
        if (bookmarks.length === 0) {
          bookmarksList.innerHTML = `<li style="color:var(--text-muted); font-size:0.75rem; padding:6px 0;">No saved places</li>`;
          return;
        }
        bookmarksList.innerHTML = bookmarks.map((b, idx) => `
          <li style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:0.8rem; cursor:pointer;">
            <span onclick="window.flyToBookmark(${b.lat}, ${b.lng})">📌 ${b.name}</span>
            <button onclick="window.removeBookmark(${idx})"><i data-lucide="trash" style="width:12px; color:var(--red);"></i></button>
          </li>
        `).join('');
        lucide.createIcons();
      }

      window.flyToBookmark = (lat, lng) => {
        map.flyTo([lat, lng], 15);
        bookmarksDropdown.style.display = 'none';
      };

      window.removeBookmark = (idx) => {
        const bookmarks = getBookmarks();
        bookmarks.splice(idx, 1);
        localStorage.setItem('terra_bookmarks', JSON.stringify(bookmarks));
        loadBookmarks();
      };

      /* 11. Real-Time GPS Tracking */
      let watchId = null;
      let gpsMarker = null;
      const gpsFollowBtn = document.getElementById('gpsFollowBtn');

      gpsFollowBtn.addEventListener('click', () => {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
          gpsFollowBtn.classList.remove('active');
          if (gpsMarker) map.removeLayer(gpsMarker);
          showToast('GPS stopped');
          return;
        }

        if (!navigator.geolocation) return showToast('Geolocation not supported');
        showToast('Tracking position...');
        gpsFollowBtn.classList.add('active');

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const latlng = [pos.coords.latitude, pos.coords.longitude];
            if (!gpsMarker) {
              const gpsIcon = L.divIcon({
                html: `<div style="background:#2563eb; width:18px; height:18px; border:3px solid #fff; border-radius:50%; box-shadow:0 0 12px rgba(37,99,235,0.85);"></div>`,
                iconSize: [18, 18], iconAnchor: [9, 9]
              });
              gpsMarker = L.marker(latlng, { icon: gpsIcon }).addTo(map);
            } else {
              gpsMarker.setLatLng(latlng);
            }
            map.panTo(latlng, { animate: true });
          },
          err => showToast(`GPS: ${err.message}`),
          { enableHighAccuracy: true, maximumAge: 1000 }
        );
      });

      /* 12. Layers & Dark Theme Switcher */
      const layerMenuToggleBtn = document.getElementById('layerMenuToggleBtn');
      const layerDropdown = document.getElementById('layerDropdown');

      layerMenuToggleBtn.addEventListener('click', () => {
        layerDropdown.style.display = layerDropdown.style.display === 'flex' ? 'none' : 'flex';
      });

      document.querySelectorAll('input[name="basemap"]').forEach(r => {
        r.addEventListener('change', (e) => {
          map.removeLayer(activeBasemap);
          activeBasemap = tileLayers[e.target.value].addTo(map);
          layerDropdown.style.display = 'none';
        });
      });

      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const themeIcon = document.getElementById('themeIcon');
      themeToggleBtn.addEventListener('click', () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        themeIcon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
        lucide.createIcons();
      });
    });
  </script>
</body>
</html>
